display_information:
  name: AFK Bot
  description: Отмечает AFK-статус в общем Canvas канала
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: afkbot
    always_online: true
  slash_commands:
    - command: /afk
      description: "AFK: /afk <время> [коммент] | back | lang [код] | wait @user"
      usage_hint: "1.5h [коммент] | back | lang ru|en|pl|uk | wait @user"
      should_escape: true
  interactivity:
    is_enabled: true
oauth_config:
  scopes:
    bot:
      - commands
      - canvases:write
      - chat:write
      - users:read
settings:
  socket_mode_enabled: true
  token_rotation_enabled: false
