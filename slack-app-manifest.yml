display_information:
  name: AFK Bot
  description: Tracks AFK status on a shared channel Canvas
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: afkbot
    always_online: true
  slash_commands:
    - command: /afk
      description: "AFK bot: /afk <number> [comment] | back | lang [code] | wait @user"
      usage_hint: "1.5 [comment] | back | lang ru|en|pl|uk|be|es | wait @user"
      should_escape: true
  interactivity:
    is_enabled: true
oauth_config:
  scopes:
    bot:
      - commands
      - canvases:write
      - chat:write
      - users:read
settings:
  socket_mode_enabled: true
  token_rotation_enabled: false
