display_information:
  name: AFK bot
  description: Tracks AFK status on a shared channel Canvas
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: "AFK bot"
    always_online: true
  slash_commands:
    - command: /afk
      description: "AFK bot - track who's away without a separate channel. /afk N [comment]: mark yourself away (N<=12 = hours, N>12 = minutes). /afk back: mark your return. /afk lang ru|en|pl|uk|be|es: set the bot's reply language (independent of the shared canvas, which stays English). /afk wait @user [@user2 ...]: get a DM when they mark their return. /afk help: show this command list."
      usage_hint: "N [comment] | back | lang [code] | wait @user | help"
      should_escape: true
  interactivity:
    is_enabled: true
oauth_config:
  scopes:
    bot:
      - commands
      - canvases:write
      - chat:write
      - users:read
settings:
  socket_mode_enabled: true
  token_rotation_enabled: false
