display_information:
  name: AFK Bot
  description: Отмечает AFK-статус в общем Canvas канала
  background_color: "#2c2d30"
features:
  bot_user:
    display_name: afkbot
    always_online: true
  slash_commands:
    - command: /afk
      description: Отметить, что ты отошёл
      usage_hint: "1.5h [комментарий] | 90m | until 15:00"
      should_escape: false
    - command: /back
      description: Отметить досрочное возвращение
      should_escape: false
    - command: /afk-lang
      description: Выбрать язык общения с ботом
      usage_hint: "ru | en | pl | uk"
      should_escape: false
  interactivity:
    is_enabled: true
oauth_config:
  scopes:
    bot:
      - commands
      - canvases:write
      - chat:write
      - users:read
settings:
  socket_mode_enabled: true
  token_rotation_enabled: false
